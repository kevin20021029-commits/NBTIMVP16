<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>NeuralFin 16 人格深度解读</title>
<style>
  :root {
    --bg-primary: #0A0A0A;
    --bg-card: #1C1C1E;
    --bg-card-alt: #222224;
    --accent-primary: #00D9A0;
    --accent-dim: rgba(0,217,160,0.15);
    --text-primary: #FFFFFF;
    --text-secondary: #9B9B9F;
    --text-disabled: #8A8A8F;
    --border-subtle: #2C2C2E;
    --accent-deep: #00B88A;
    --accent-bright: #4DFFC4;
    --accent-08: rgba(0,217,160,.08);
    --accent-25: rgba(0,217,160,.25);
    --accent-35: rgba(0,217,160,.35);
    --accent-40: rgba(0,217,160,.40);
    --accent-50: rgba(0,217,160,.50);
    --bg-primary-0: rgba(10,10,10,0);
    --bg-primary-92: rgba(10,10,10,.92);
    --bg-primary-94: rgba(10,10,10,.94);
    --brand-gold: #D9B54F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background:
      radial-gradient(circle at 18% 16%, rgba(0,230,138,.08), transparent 30%),
      radial-gradient(circle at 82% 10%, rgba(145,201,255,.06), transparent 30%),
      radial-gradient(circle at 88% 78%, rgba(215,183,104,.05), transparent 30%),
      var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }

  /* ---- header(与 NBTI 一致) ---- */
  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  .brand img { height: 28px; width: auto; display: block; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .version { font-size: 12px; color: var(--text-secondary); }
  .lang-switcher { font-size: 13px; }
  .lang-option { color: var(--text-disabled); text-decoration: none; padding: 4px 6px; border-radius: 6px; }
  .lang-option:hover { color: var(--accent-primary); }
  .lang-option[aria-current="page"] { background: var(--accent-primary); color: var(--bg-primary); font-weight: 800; border-radius: 999px; }
  .lang-divider { color: var(--border-subtle); }

  /* ---- hero ---- */
  .hero { text-align: center; padding: 44px 0 36px; }
  .eyebrow { display: inline-block; border: 1px solid var(--accent-25); border-radius: 999px; padding: 8px 14px; background: var(--accent-dim); color: var(--accent-primary); font-size: 12px; letter-spacing: 1px; font-weight: 700; margin-bottom: 20px; }
  .hero h1 { font-size: 34px; font-weight: 800; line-height: 1.25; letter-spacing: 0.01em; margin-bottom: 14px; }
  .hero-sub { color: var(--text-secondary); font-size: 15px; line-height: 1.8; max-width: 560px; margin: 0 auto; }

  /* ---- 人格网格 ---- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; } }
  .p-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; overflow: hidden; cursor: pointer; padding: 0; text-align: center; transition: transform .15s, border-color .15s; }
  .p-card:hover { border-color: var(--accent-40); transform: translateY(-2px); }
  .p-card:active { transform: scale(.97); }
  .p-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .p-name { font-size: 15px; font-weight: 700; padding: 10px 8px 2px; letter-spacing: 0.02em; }
  .p-code { display: inline-block; font-size: 11px; color: var(--accent-primary); border: 1px solid var(--accent-25); background: var(--accent-dim); border-radius: 999px; padding: 2px 8px; margin-left: 6px; letter-spacing: 1px; vertical-align: 2px; }
  .p-en { font-size: 11px; color: var(--text-secondary); padding: 2px 8px 12px; }

  /* ---- 弹层 ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal-overlay[hidden] { display: none; }
  .modal-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 88dvh; overflow-y: auto; position: relative; padding: 22px 20px calc(26px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .modal-card { border-radius: 18px; max-height: 85vh; } }
  .modal-close { position: absolute; top: 12px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-subtle); background: var(--bg-card-alt); color: var(--text-secondary); font-size: 16px; cursor: pointer; z-index: 2; }
  .modal-close:active { transform: scale(.92); }
  .modal-head { text-align: center; padding: 8px 32px 0; }
  .modal-head img { width: 110px; height: 110px; border-radius: 14px; object-fit: cover; display: block; margin: 0 auto 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .modal-head .type-badge { display: inline-block; font-size: 11px; color: var(--accent-primary); border: 1px solid var(--accent-25); background: var(--accent-dim); border-radius: 999px; padding: 5px 12px; letter-spacing: 1px; margin-bottom: 8px; }
  .modal-head .persona { font-size: 30px; font-weight: 800; letter-spacing: 0.02em; }
  .modal-head .p-en-lg { font-size: 13px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 0.05em; }
  .modal-head .tagline { font-size: 14px; line-height: 1.8; color: var(--text-secondary); margin-top: 10px; }
  .modal-body { margin-top: 18px; }
  .card { background: var(--bg-card-alt); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h3 { font-size: 14px; color: var(--accent-primary); letter-spacing: 1px; margin-bottom: 12px; font-weight: 700; }
  .card p { font-size: 15px; line-height: 1.8; color: var(--text-primary); word-break: break-word; overflow-wrap: break-word; }

  /* ---- 四维条 ---- */
  .stat-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .stat-label { width: 72px; flex: none; font-size: 12px; color: var(--text-secondary); }
  .stat-track { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-deep), var(--accent-bright)); min-width: 2px; }
  .stat-val { width: 34px; flex: none; text-align: right; font-size: 12px; color: var(--accent-primary); font-weight: 700; }

  /* ---- 深度解读(App 内全量展示) ---- */
  .dd-preview { font-size: 15px; line-height: 1.9; color: var(--text-primary); margin-bottom: 6px; word-break: break-word; overflow-wrap: break-word; }
  .dd-section h4 { color: var(--accent-primary); font-size: 14px; margin: 14px 0 6px; letter-spacing: .5px; }
  .dd-section p { font-size: 15px; line-height: 1.9; color: var(--text-primary); margin: 0; word-break: break-word; overflow-wrap: break-word; }

  footer { text-align: center; color: var(--text-disabled); font-size: 12px; padding: 40px 0 8px; }
</style>
</head>

<script>

var DATA = {"lang":"zh","personas":[{"code":"RGHC","word":"SNIPER","name":"猎手","tagline":"你研究十年，出手一次。猎物从没跑掉过——直到你上次抄底抄在了半山腰。","traits":["你是朋友圈里的「股神」，大家亏钱都来问你。","你的问题不是选股，是拿不住——逻辑对了，手却管不住。","冷静是你的超能力，但冷静太久容易错过最肥的一段。"],"recommendedAsset":"你重仓的那只股票（你研究它十年了）","statBars":[85,35,99,60],"img":"sniper","deepDive":{"preview":"你不是不敢下手，你是不甘心随便下手。你研究一只票的时间，比谈一场恋爱还认真——翻遍财报、算清估值、把管理层的历史发言逐字检索，然后等一个「确定性够高」的瞬间。你身边的人都以为你谨慎，只有你知道，你等的不是最好的买点，是那个「万一错了也不能怪自己」的理由。可奇怪的是，你等得越久，扣扳机的那一刻反而越容易手抖：因为这次如果错了，不再是「运气不好」能解释的——是你研究了三个月，还是错了。","sections":[{"title":"行为根源","content":"你的完美主义不是天生的，是曾经「随便买」亏过一次大的。那笔亏损让你学到的不是止损，而是「以后不能没研究就出手」。于是你把「研究」当成了唯一能控制的变量——股价你控制不了，消息面你控制不了，但你至少可以把 PDF 翻烂。这本质上是一种心理补偿：用过程的勤奋，对冲结果的不确定。问题在于，市场不给你发「努力奖」，你研究得越深，沉没成本越大，越难承认「这票我可能看错了」。你等的那个「确定性够高」，在真实市场里几乎不存在，它只是你不敢承认「研究再深也要试错」的挡箭牌。"},{"title":"关系盲点","content":"你最看不上的，是那些「追热点」的人——你觉得他们不配赚钱。但你没意识到，你的「深度研究」有时候只是给「不敢行动」找的一个体面借口。朋友兴冲冲跟你分享他买的票，你第一反应是挑出三个逻辑漏洞，然后看着他脸上的光熄灭。你说你是为他好，其实你是在捍卫「研究至上」这套让你安心的世界观。你错过了很多次朋友拉你上车的机会，也错过了很多次你明明已经看对、却因为「还没完全确认」而放走的行情。你身边真正懂你的人不多，不是因为你难相处，是因为你总在别人还没说完的时候就预判了结局。"},{"title":"成长处方","content":"你需要的不是更多研究，是一个「止损即止损、不用完整逻辑闭环」的强制纪律。给每次出手设一个物理上限：研究时间上限、试仓金额上限、持有时间上限。你要学会小仓位试错——用「买了再验证」代替「验证完再买」，你会惊讶地发现，市场给你的反馈比你三个月的研究准确得多。以及最重要的：允许自己错一次而不复盘三小时。你缺的从来不是信息，是「带着不完美出手」的勇气。记住一句话：完美主义者在市场上最好的位置，是给别人当反向指标。"}]},"enName":"The Sniper"},{"code":"RSHC","word":"TURTLE","name":"龟仙人","tagline":"你的持仓年限，比你谈过的恋爱还长。","traits":["你 2021 年买的白酒，今年终于……还差 20% 回本。","你的字典里没有「割肉」，只有「长期主义」。","说真的，大多数人都该学你，可惜没人学得会。"],"recommendedAsset":"任何 ETF——反正你要拿 30 年","statBars":[98,15,3,30],"img":"turtle","deepDive":{"preview":"你的持仓年限，比你手机里所有 App 的使用年限都长。别人问你怎么熬过那些暴跌，你说「没熬，我根本没打开过软件」。这句话听起来云淡风轻，但只有你自己知道，有那么几个深夜，你也曾经手贱点开过 App，看到绿得发黑的数字，然后假装什么都没看见地关掉，在黑暗里躺了半小时才睡着。你不是不慌，你只是把「慌」这个按钮，焊死在了自己够不到的地方。","sections":[{"title":"行为根源","content":"你不是天生佛系，你只是发现「不做决定」比「做错决定」更让你心安。你大概率有过一次割在最低点的经历——那种刚卖就反弹的刺痛，让你从此立誓「再也不看盘」。长期主义对你来说不是策略，是心理防线的名字。你把「拿住」和「负责」画了等号：只要我不动，就没人能说我这步走错了。这套逻辑在牛市里让你成为传奇，在熊市里让你成为「沉没成本」的忠实信徒——尤其是当你的持仓已经腰斩，你依然能给自己讲出「三年后回本」的故事时，你需要停下来想一想：这到底是信仰，还是不敢面对。"},{"title":"关系盲点","content":"你最看不惯短线操作的朋友，觉得他们像赌场的转盘一样转个不停。但你悄悄羡慕他们的灵活——他们能在崩盘前跑掉，而你只能把「已读不回」当作防御姿势。家里人和你聊理财，你永远用「长期主义」四个字堵回去，时间长了，没人再跟你聊钱的事。你省下了很多争吵，也损失了很多信息：别人的止损线、市场情绪的变化、甚至机会本身。你把自己活成了一座孤岛，岛上只有你和你的持仓，以及一句「时间会证明一切」。"},{"title":"成长处方","content":"长期主义不等于「永远不检查」。你缺的是一套「定期复盘」的机制：每季度固定一天，打开账户，只回答三个问题——当初买入的逻辑还成立吗？仓位还睡得着吗？如果今天空仓，我还会买它吗？第三个问题的答案比前两个都重要。另外，请给自己设一条物理止损线并写在纸上贴起来：不是让你割肉，是让你在极端行情下有个「不用做决定」的预案——你的问题从来不是拿不住，是拿得太多、太久、太没有依据。记住：真正的长期主义，是每次检查完都能睡得着的那种，而不是不敢看的那种。"}]},"enName":"The Zen Turtle"},{"code":"RGTC","word":"BOT","name":"量化猎人","tagline":"你有一个策略，一个止损，和一个不存在的感情生活。","traits":["你的交易记录精确到小数点后两位，你的亏损也是。","数据是你的信仰，可惜市场偶尔不信数据。","建议：把策略里的「回撤 20% 加仓」改成「回撤 20% 反省」。"],"recommendedAsset":"高频交易手续费套餐（你的主要支出）","statBars":[70,95,99,50],"img":"bot","deepDive":{"preview":"你相信数据，胜过相信任何人说的话——包括你自己昨天说的话。你的交易记录精确到小数点后两位，回测报告写得比论文还严谨，你会因为一根均线的参数差了 0.5 而整夜睡不着。但市场有个坏习惯：它偶尔就是不按你的模型出牌。那一刻，你比任何感性交易者都更崩溃——因为你连「崩溃」这件事，都觉得不该发生在一个理性的人身上。","sections":[{"title":"行为根源","content":"你把「控制感」寄托在数字上，是因为现实生活里有些事，你控制不了——而 K 线至少看起来是有规律的。你的策略越复杂，你越安心，因为复杂度本身就像一堵墙，挡住了「市场可能根本不可预测」这个念头。你做的每一版回测，本质上都是在问同一个问题：能不能给我一个确定性？可惜市场不欠你确定性。你真正害怕的不是亏损，是「亏损之后找不到解释」——那意味着你的整套世界观出现了裂缝，而你宁愿亏钱，也不愿意看见那条裂缝。"},{"title":"关系盲点","content":"你身边的人觉得你很难沟通感情，其实你只是不知道怎么处理「没有标准答案」的事。别人跟你聊情绪、聊直觉、聊「我感觉要涨」，你内心的回复永远是「样本量不足」。你不是冷漠，你是把每一次对话都当成了数据校验——别人要的是共鸣，你给的是纠错。久而久之，愿意跟你聊市场的人越来越少，最后只剩下你的回测曲线陪着你。可你要知道，市场里最贵的那些信息，恰恰来自那些「没有数据支撑」的人：资金的情绪、操盘的意图、散户的恐慌，这些东西量化不出来，但真实存在。"},{"title":"成长处方","content":"你需要给模型加一个「人类情绪」变量，而不是假装它不存在。每周留出 10% 的仓位，允许自己「凭感觉」交易——不是让你乱来，是让你承认直觉也是一种数据。同时给你的回测加上「极端场景」：如果连续三次触发止损，你还能不能执行策略？大多数人的模型不是输在数学，是输在实盘时的手抖。最后，学会把「我不知道」说出口：承认市场不可预测，不代表你的努力没有意义，恰恰相反——知道自己不知道，才是你的模型里最缺的那个参数。"}]},"enName":"The Bot"},{"code":"RSTC","word":"GRANDMA","name":"精算师","tagline":"你连买菜都要算收益率，却在股市里做慈善。","traits":["每一笔交易你都有计划，除了割肉的时候。","你的胜率很高，但你赚的还不够手续费。","保守不是缺点，但你错过的那几只十倍股，够你算十年的。"],"recommendedAsset":"国债——它们和你一样稳（无聊）","statBars":[40,90,85,45],"img":"grandma","deepDive":{"preview":"你连买菜都要算收益率，但你在股市里做的，其实是慈善。每一笔交易你都有精密的计划，胜率高得惊人——可惜赚的钱，刚好够付手续费。你不是不懂进攻，你只是把「不亏」看得比「多赚」重要一万倍。这份谨慎让你避开了所有的大坑，也避开了所有的大机会。你的人生格言是「稳字当头」，但偶尔深夜你也会想：如果当年那次，我没那么稳呢？","sections":[{"title":"行为根源","content":"你对「确定性」的执念，往往来自一次让你记忆深刻的意外损失——可能不是股市，是更早的某件事。那件事教会了你「安全第一」，从此你的人生变成了一场风险规避游戏。你的每一笔交易都带着三重检查：基本面、技术面、以及「万一全错了我能不能承受」。这套系统保护了你，也困住了你：你赚到的每一分钱都是「小钱」，因为大机会一定伴随着你无法接受的大波动。你不是贪婪的反面，你是「害怕后悔」的化身——你怕的不是亏钱，是亏了之后责怪自己「当初为什么不稳一点」。"},{"title":"关系盲点","content":"你身边爱冒险的朋友觉得你无聊，但他们私下都羡慕你从不失眠。你最大的问题不是朋友少，是你把「稳妥」也传染给了下一代——家人问你理财建议，你永远说「存银行最保险」，不是因为银行真的最好，是因为如果建议亏了，你会比他们更自责。你习惯了把风险扛在自己肩上，于是把机会也一并挡在了门外。你听不得「梭哈」两个字，但你也要承认：有些你羡慕的人，靠的不是胆子大，是敢承担「看错」的后果——这件事你其实也做得到。"},{"title":"成长处方","content":"适度放宽你的安全边际，你会发现「小赌怡情」和「稳」并不矛盾。给你的资产做三层分桶：大部分继续按你的方式稳健配置（这部分是让你睡得着的），留出一小部分设好上限，专门用来「尝试你平时不敢碰的机会」——金额小到你亏了也不会失眠，但大到你赢了会有感觉。你会发现一个秘密：当你把「最坏结果」提前封顶之后，你的胆子会大得连自己都惊讶。你缺的从来不是判断力，是「允许自己小规模犯错」的许可。"}]},"enName":"The Grandma"},{"code":"FGHC","word":"PROPHET","name":"传教士","tagline":"你坚信一个故事，然后把它讲给所有人听——包括自己。","traits":["你买入的那一刻，不是建仓，是皈依。","别人问你仓位，你说「信仰不需要仓位」。","好消息：你的直觉偶尔准得可怕。坏消息：你分不清哪次准。"],"recommendedAsset":"加密货币——信徒的天堂，韭菜的坟场","statBars":[99,12,3,"MAX"],"img":"prophet","deepDive":{"preview":"你买入的那一刻，不是建仓，是皈依。你坚信一个故事，然后把它讲给所有人听——包括那个其实还没完全说服自己的你。别人问你仓位多重，你说「信仰不需要用仓位衡量」，但深夜里，你也悄悄查过好几次这个「信仰」的实时价格。你不是在投资一个公司，你是在押注一个未来，而最可怕的是：你讲的故事太动听了，连你自己都信了。","sections":[{"title":"行为根源","content":"你对「确定性叙事」的渴望，本质是对不确定世界的一种反抗。你需要的不是一个好公司，是一个「可以讲给别人听的故事」——因为故事能给你掌控感：只要逻辑自洽，世界就还在我的理解范围内。你的问题不是看错方向，是看错之后拒绝修正：当现实和你的故事冲突时，你会第一时间给现实找理由，而不是给故事打补丁。「主力洗盘」「情绪错杀」「短期波动」——你的语言系统里有无数个词，用来保护同一个信念。你内心深处其实知道真相，但你不敢停下来，因为停下来就等于承认：自己当成信仰的东西，可能只是一笔普通的、会亏钱的交易。"},{"title":"关系盲点","content":"你身边的人一开始被你的热情感染，后来开始有意躲着你聊这个话题。因为你每次开口都像布道，而布道不允许质疑——朋友说「要不先减点仓」，你听到的不是建议，是「他不相信我」。你把人分成了两类：信你的和不懂的。这让你拥有了信徒，也失去了诤友。你从来不知道，那些真正关心你的人，其实早就看出了你故事里的漏洞，只是看你讲得太投入，不忍心打断。你错过了很多次「被拉一把」的机会，因为你把所有的善意提醒，都翻译成了背叛。"},{"title":"成长处方","content":"信仰和仓位管理可以共存，你需要学的不是怀疑，是「分批验证」。把你想讲的那个故事，拆成三个可以被证伪的节点：什么数据出现=故事成立，什么数据出现=故事错了。写下来，贴在你的交易软件旁边。然后给自己的仓位设一个「信仰折扣」：你可以继续相信，但持仓上限不能超过你愿意全亏的数字。最后，练习接受一个残酷事实：你讲的故事大概率是对的骨架、错的细节，而市场上赚钱的，从来都是「骨架对了就及时调整细节」的人，不是「为了面子焊死细节」的人。"}]},"enName":"The Prophet"},{"code":"FSHC","word":"MONK","name":"佛系玩家","tagline":"你的投资策略：买了，忘了，随缘。","traits":["你去年定投的基金，你连名字都快忘了。","市场暴跌那天，你在睡觉，这是你赢过所有人的原因。","偶尔打开一次账户：哦，翻倍了。然后继续睡觉。"],"recommendedAsset":"余额宝——你的青春，你的主场","statBars":[45,75,2,"MIN"],"img":"monk","deepDive":{"preview":"你的投资策略：买了，忘了，随缘。市场暴跌那天你在睡觉，这是你赢过所有人的原因。偶尔打开一次账户——哦，翻倍了，然后你继续睡觉。这种松弛感让所有人羡慕，但只有你知道，这份「不在乎」，一开始其实是装出来的。你并不是真的放下了，你只是把账户藏到了自己的视野盲区，假装它不存在。","sections":[{"title":"行为根源","content":"你的「随缘」，大概率源自一次让你太痛的经历。可能是重仓过一只票，看着它从天堂跌到地下室，而你什么都做不了。那次之后你学会了一个技能：把注意力从账户上移开，时间久了，连自己都信了自己「心态好」。佛系是你给自己穿上的盔甲，盔甲之下是那个「再也不想经历那种无能为力」的自己。你的问题是：你分不清自己是「看透了」还是「回避了」——而这两者，在账户曲线上长得一模一样，直到某天你需要用钱，被迫打开账户，才发现自己已经把「不看」当成了「不管」。"},{"title":"关系盲点","content":"朋友觉得你心态好，但也偶尔觉得你对钱的事太「不上心」——这让合伙做事变得有点难。你嘴上说「你们决定就行」，心里其实有一杆秤，只是从不拿出来校准。你怕暴露自己的在意，因为在意意味着可能再次受伤。于是你错过了很多次坦诚沟通的机会：该说不满的时候你沉默，该表态的时候你说「随便」。你以为随缘是洒脱，在别人眼里，有时候是「他根本不在乎我们共同的钱」。你值得被信任，但信任的前提，是让别人看见你真的在乎。"},{"title":"成长处方","content":"你需要的不是更「上心」，而是一个「定期不经意查看」的轻量机制：比如每月一号的日历提醒，只花十分钟回答一个问题——如果今天要重新配置，我还会保留这笔持仓吗？答不上来，就该认真看了。你不需要变成盯盘狂魔，你只需要让「随缘」成为一个主动选择，而不是一个被动结果。记住：真正的佛系是「看过了，然后放下了」，不是「不敢看，所以放下了」。前者是境界，后者只是把问题推迟到某个你不得不面对的日子。"}]},"enName":"The Monk"},{"code":"FGTC","word":"God of Gamblers","name":"赌神","tagline":"你赢的时候叫股神，输的时候叫赌狗。","traits":["你的盘感强得离谱，但你的手比盘感更快。","一天不交易，你就浑身难受。","建议把持仓时间从「3 小时」改成「3 天」，你会感谢我的。"],"recommendedAsset":"一张去澳门的机票","statBars":[92,20,8,88],"img":"gambler","deepDive":{"preview":"你赢的时候大家叫你股神，输的时候叫你赌狗，你自己觉得这俩其实是同一个人。你的盘感强得离谱，但你的手比盘感更快——一天不交易，你就浑身难受，像戒断反应。你的持仓记录里，最短的持股时间是四十分钟。这种「必须在场」的冲动，是你最大的天赋，也是你最大的破绽：你享受的从来不是赚钱，是「做决定」本身带来的多巴胺。","sections":[{"title":"行为根源","content":"这种「必须交易」的冲动，心理学上更接近一种情绪调节方式，而不是策略选择。你的每一次开仓，本质上都是在处理体内涌动的那股躁动——无聊的时候交易，焦虑的时候交易，开心的时候更要交易庆祝一下。你的盘感是真的好，好到市场大多数时候确实按你的直觉走，这反而成了最大的陷阱：因为十次里九次对了，你永远分不清第十次是「状态不好」还是「盘感失灵」。你把自己的天赋，用在了最不该用的地方——高频地重复同一个动作，直到某天市场用一个你完全没预料到的剧本，把你十次赢的钱一次收走。"},{"title":"关系盲点","content":"你身边的人喜欢跟你一起冒险，但没人敢真正把钱托付给你。你在饭桌上永远是最亮的那个，讲起行情眉飞色舞，大家听完都觉得「跟着你干有肉吃」——可到了真要掏钱的时候，所有人都找借口溜了。你不缺朋友，缺的是信任：你的生活方式让大家觉得，你的钱和你的判断一样，都是来也快去也快。你也隐隐知道这一点，所以你从不在人前谈亏损——你怕一旦露怯，连最后那点「跟着你没错」的幻觉都没了。可真正的朋友，不是来看你赢的，是来陪你输的。"},{"title":"成长处方","content":"把「持仓时间」从 3 小时改成 3 天，不是为了赚更多，是为了先活下来。你的问题从来不是选股，是「必须做点什么」的冲动。给自己设硬规则：每天最多开仓一次，开仓前必须写下「买入逻辑」和「止损价」，收盘前禁止再动。你不是不能靠盘感赚钱，你只是需要给盘感加上「纪律」这个刹车——就像赛车手不是不开快车，是知道哪条弯道必须减速。如果你能做到连续一个月不因为手痒而交易，你会惊讶地发现：你的收益率没降，你的睡眠质量先上去了。"}]},"enName":"God of Gamblers"},{"code":"FSTC","word":"GEAR","name":"打工人","tagline":"别人炒股是投资，你炒股是兼职。","traits":["你的目标很朴素：赚个早餐钱就跑。","好消息：你从不亏大钱。坏消息：你赚的还不够买早餐。","但你的心态赢了 90% 的股民——起码你睡得着。"],"recommendedAsset":"可转债打新——本打工人的信仰","statBars":[35,80,65,40],"img":"gear","deepDive":{"preview":"别人炒股是投资，你炒股是兼职。你的目标很朴素：赚个早餐钱就跑。好消息是你从不亏大钱，坏消息是你赚的还不够买杯像样的咖啡。你每天的流程比上班还准时：九点半盯盘，十点杀进，十一点落袋，中午准时午休——账户曲线平得像你的 KPI，稳定得让人心疼。你赢了 90% 的散户的心态，但你从来没赢过市场。","sections":[{"title":"行为根源","content":"你对「小赚就跑」的执念，其实是把股市当成了另一份需要「下班」的工作。你害怕的不是亏钱，是「被套住」——因为被套意味着这份兼职开始占用你睡觉的时间，违背了你「不加班」的原则。于是你的策略变成了：赚一点就跑，跌一点也跑，永远不给自己「被套」的机会。这套打法让你成为了朋友圈里最稳的人，但也让你永远停在小打小闹的层级：你的每一次「落袋为安」，都在为你的「安全感」付费，而市场的真实收益，从来不会因为你想早点下班就打折。"},{"title":"关系盲点","content":"身边人觉得你太保守，但他们不知道你早就算过风险和收益比——你比他们以为的聪明得多，只是聪明用在了「怎么少操点心」上。你不太跟人聊投资，因为你觉得「聊了也不会改变什么」，这个想法让你错过了很多信息和机会。朋友拉你进群看研报，你说「没空」，其实你晚上刷了三个小时的短视频。你不是没时间，你是把自己的精力分配表做得太死板了——你把投资框在「早九点半到十一点」这个格子里的同时，也把机会挡在了格子外面。"},{"title":"成长处方","content":"适度延长持有周期，你的「打工思维」其实更适合定投而不是短炒。你最大的资产是稳定，最大的浪费也是稳定——稳定地赚小钱，稳定地错过行情。试试这个实验：把每次交易的持有时间翻一倍，赚了不跑，看看会发生什么。你会发现大部分时候，多拿一天并没有让你少赚，偶尔多拿一周，收益远超你过去一个月的「早餐钱」。你不需要变成赌徒，你只需要承认：市场给持有者的奖励，永远比给「跑得快的人」的多——你不缺跑的纪律，你缺的是坐得住的勇气。"}]},"enName":"The Gear"},{"code":"RGHP","word":"MARTYR","name":"杠杆烈士","tagline":"你研究得很认真，然后加了 3 倍杠杆。","traits":["你的研究报告写满三页纸，风险提示写在第四页——没看。","你坚信这次不一样，市场说：每次都一样。","你离财务自由只差一次成功，也离天台只差一次失败。"],"recommendedAsset":"跌停板——你与它相拥的次数最多","statBars":[90,5,55,95],"img":"martyr","deepDive":{"preview":"你的研究报告写满三页纸，风险提示写在第四页——你没看。你坚信这次不一样，市场却总是说「每次都一样」。你离财务自由只差一次成功，也离天台只差一次失败，而你偏偏就爱这种走钢丝的感觉。别人劝你控制杠杆，你听到的不是风险提示，是「他不懂我的机会」。你不是输给了市场，你是输给了那个「一定要赢给你看」的自己。","sections":[{"title":"行为根源","content":"你对杠杆的迷恋，本质是对「慢慢变富」这件事缺乏耐心。你心里有一个时间表：三十岁之前必须财务自由，必须让所有看不起你的人闭嘴。杠杆是这个时间表唯一的捷径——它让你的本金假装翻倍，也让你的焦虑同步放大。你每次加杠杆时的心理活动出奇一致：「这次我有把握，稳了」。而你每次爆仓后的心理活动也同样一致：「再给我一次机会」。你的问题不是判断力——你的判断力其实中等偏上——是你的时间表太贪婪，逼着你的判断力去做它做不到的事。"},{"title":"关系盲点","content":"家人朋友劝你收手时，你听到的不是关心，是「他们不相信我能成功」。你把「收手」等同于「认输」，把「控制仓位」等同于「承认自己不行」。你身边的人其实早就看出你的状态不对——你开始消瘦、熬夜、脾气变差，但你用「拼事业」三个字把所有关心都挡了回去。你把自己活成了一场独角戏，主角是你，观众是你，裁判也是你。而真正爱你的人，在台下看得心惊肉跳，却不敢开口——因为每次开口，你都会把这出戏演得更用力。"},{"title":"成长处方","content":"不是不能用杠杆，是你需要一个「输了就必须停」的硬性规则，而不是靠自控力。自控力是你最靠不住的东西——你输红了眼的时候，什么道理都听不进去。所以规则必须写在别处：给一个信任的人你的账户权限，约定好「连续触发两次止损，你替我把杠杆全部卸掉」；或者给自己设一条「物理红线」——杠杆比例超过某个值，自动全部平仓。你要接受一个残酷的事实：你过去赚到的每一笔钱，都不是你「控制住了风险」，而是你「运气好没出事」。你能活到今天不是因为你强，是因为市场还没认真跟你算总账。"}]},"enName":"The Leverage Martyr"},{"code":"RSHP","word":"BAGHOLDER","name":"大冤种","tagline":"你研究得越认真，套得越深。","traits":["你买在最高点的概率是 100%，哪怕那股票已经涨了十倍。","你最大的资产叫「等回本」，已经等了三年。","好消息：你终于学会止损了。坏消息：学完你就反弹了。"],"recommendedAsset":"一本《高点接盘纪念册》（已绝版，因销量太好）","statBars":[85,10,45,90],"img":"bagholder","deepDive":{"preview":"你买在最高点的概率是 100%，哪怕那股票已经涨了十倍你也能精准接盘。你最大的资产叫「等回本」，已经等了三年。好消息是你终于学会止损了，坏消息是你刚学会，它就开始反弹了——这种精准的倒霉，简直是一种被上天特别关照的才华。你嘴上说「无所谓，拿着呗」，只有你知道，每次看到那个成本价，心里都像被针扎了一下。","sections":[{"title":"行为根源","content":"你的「高点接盘」体质，其实和一种心理偏差有关——你总在「错过恐惧」最强烈的时候出手。你看着它涨，越涨越难受，最后在某个「再不上车就来不及了」的瞬间冲进去。你买的不是股票，是「不想再错过」这个念头。而更麻烦的是，你持仓之后会发展出「成本价崇拜」：你的决策坐标系从「这票现在值不值」变成了「我成本是多少」——所有信息都被你翻译成「离回本还差几个点」。你不是在投资，你是在跟自己的成本价谈恋爱，而这段感情里，市场从来没答应过要对你负责。"},{"title":"关系盲点","content":"朋友们私下叫你「反指」——你买什么，什么就跌。但没人真的觉得你蠢，大家只是心疼你太诚实。你从来不隐瞒自己的亏损，甚至带着自嘲的语气讲出来，这让你成为了大家的「开心果」，也让你成为了那个「没人当真的人」。你说要抄底的时候，大家笑笑就过去了——你早就发现，自己的话在朋友那里越来越没有分量，但你不知道该怎么赢回它。你不是输在眼光，是输在你把「认错」当成了「认输」：只要你说出「我卖错了」，你就觉得自己彻底失败了。"},{"title":"成长处方","content":"你需要的不是更准的择时，是一套「分批建仓」的强制纪律。从今往后，任何一只票，最多先用计划仓位的三分之一进场，涨了再加，跌了更要加——但每次加仓都要问自己：如果我今天空仓，我还会买它吗？这个问题的答案，比任何技术指标都真实。另外，练习一次「主动认错」：挑一只套了三年的票，在某个不是最低点的地方卖掉它，不是为了回本，是为了拿回你决策的主动权。你会发现，卖出之后那种如释重负，比「等回本」刺激多了。"}]},"enName":"The Bagholder"},{"code":"RGTP","word":"FOMO","name":"追高侠","tagline":"别人贪婪我恐惧，别人恐惧我……接盘。","traits":["你的买入信号：连续涨停 + 全网都在吹。","你的卖出信号：跌回你的成本价，然后割肉。","你为市场提供了流动性，是真正的无私奉献者。"],"recommendedAsset":"山顶的空气——新鲜、昂贵、你已购买多份","statBars":[65,25,70,85],"img":"fomo","deepDive":{"preview":"你的交易记录里没有「错过」两个字——因为只要市场在涨，你就一定在场。你买入的理由永远是「它还在涨」，卖出的理由永远是「它跌了」——你的策略本质上只有一个：追。你追过最热的板块，买过最贵的热点，朋友圈谁晒收益你就问代码。你赚过钱，但你的钱不是「赚」来的，是市场暂时放在你这里、随时要拿走的。","sections":[{"title":"行为根源","content":"你的「追高」，本质上是一种社交行为——你怕的不是亏钱，是「大家赚钱的时候我不在场」。对你来说，错过一场上涨，比亏钱更难受：亏钱至少说明你参与了，错过意味着你被排除在话题之外。所以你总是等不及回调，等不及确认，等「它已经开始涨了」才冲进去——你买的不是价值，是「在场感」。你的账户曲线说明了一切：上涨的时候你追进去，回调的时候你割出来，一来一回，你给市场贡献了手续费，市场给你贡献了焦虑。"},{"title":"关系盲点","content":"你是朋友圈里最活跃的「情报站」——谁有什么消息都爱先跟你说，因为你知道得多、转发得快。但你仔细想想：有人真的把你的建议当回事吗？大家把你当成「热度的温度计」，而不是「判断力的参照」——因为你分享的永远是最新热点，而不是最稳的判断。你身边的人靠你的信息赚过钱，但没人把自己的本金托付给你，这让你偶尔深夜有点失落：你明明那么努力地「跟上市场」，为什么大家只把你当信号源，不当伙伴？"},{"title":"成长处方","content":"你需要把「追」改成「等」。给自己立一条铁律：任何热点，至少等它回调超过 15% 再考虑，且买入后必须写下一句话——「为什么现在买，而不是上周买」。如果写不出来，就不买。你最大的优势是信息灵通，最大的浪费是把信息优势用在了最危险的位置（追高）而不是最安全的位置（回调确认）。另外，每周删掉一个「让你焦虑」的群——你的情绪不该被别人的收益截图控制。记住：市场上最贵的一句话，是「我朋友圈有人赚了」。"}]},"enName":"The Chaser"},{"code":"RSTP","word":"STALKER","name":"焦虑盯盘侠","tagline":"你的手机电量，全贡献给了行情页。","traits":["你每分钟刷一次价格，哪怕你知道它不会变。","你的心跳曲线，比你的持仓曲线还刺激。","建议把看盘时间换成睡觉，你的血压会感谢你。"],"recommendedAsset":"降压药板块——你迟早需要的行业","statBars":[30,40,"∞",75],"img":"stalker","deepDive":{"preview":"你不是在看盘，你是在守护。你的手机屏幕使用时长报告里，交易软件稳居第一——早上睁眼先看美股，通勤路上刷消息，午饭时间查持仓，睡前还要最后确认一眼「没有大事发生」。你的股票没怎么动，你倒是先把自己熬成了基金经理的作息。别人问你怎么拿得住，你说「我了解它」，只有你知道，你是靠着每分钟刷新一次，才勉强压住心里那句「要不要跑」。","sections":[{"title":"行为根源","content":"你的高频盯盘，本质是一种「控制错觉」的自我安慰：你以为看得越多，就越能抓住机会、躲开风险——其实市场不会因为你多看了它一眼就改变走势，但你确实因为多看了它一眼，多失眠了三个小时。你的焦虑不是来自持仓，是来自「信息真空」的恐惧：只要有一分钟没看，你就觉得有大事发生。讽刺的是，你的每一次交易冲动，几乎都发生在「盯盘盯到忍不住」的时候——你盯着它，不是因为它需要你，是因为你需要它来确认「一切还在掌控中」。而市场最擅长的事，就是让你以为自己在掌控。"},{"title":"关系盲点","content":"你的家人和朋友,早就在你的生活里给交易软件让位了。饭桌上你刷消息,电影院里你刷消息,甚至连聊天的时候,你的眼神都会不自觉瞟向手机屏幕上的那条 K 线。你说「我就看一眼」,但你的伴侣知道,这一眼之后是五分钟的沉默。你不是不爱他们,你是把「盯着盘」当成了「负责任」——仿佛不盯着,就是对账户不负责。可你有没有想过:你为账户付出了所有注意力,账户却没有为你的生活付出一分钱。真正该被守护的,从来不是那条曲线。"},{"title":"成长处方","content":"你需要给「看盘」设一个合法的发车时间,像上班打卡一样:每天只允许三个时段看盘——开盘后 15 分钟、午休 10 分钟、收盘后 10 分钟,其余时间把软件图标藏进文件夹里。开始会很难受,像戒断一样,但两周后你会惊讶地发现:你错过的那些「大事」,绝大部分什么都没发生。你手里最大的资产不是那只股票,是你的注意力——而注意力这种东西,市场永远在贪婪地收购。你要学会的不是更准确地看盘,是更体面地不看盘。"}]},"enName":"The Stalker"},{"code":"FGHP","word":"DREAMER","name":"梦想家","tagline":"你的持仓里，有一个价值十万的梦想和两万块的现实。","traits":["你 all-in 的那一刻，配乐都是史诗级的。","你的故事讲给所有人听：太空、AI、改变世界。","偶尔也讲讲：什么时候回本。"],"recommendedAsset":"太空概念股——梦要够大，跌才够疼","statBars":[97,8,15,80],"img":"dreamer","deepDive":{"preview":"你买股票不是买公司,是买一个平行宇宙:在那里面,你辞了职、买了房、环游世界,再也不用看老板脸色。你的持仓逻辑是「它总有一天会涨回来的」,这个「总有一天」在你心里已经排练了一百遍,但你从来没给「总」字定过截止日期。你的梦想很贵,贵到你的账户已经为它连续支付了三年利息。你不是贪心,你只是把投资当成了通往理想生活的传送门——可惜传送门也需要门票,而你一直在透支未来买票。","sections":[{"title":"行为根源","content":"你的「梦想投资法」,源于一种很常见的心理补偿:现实里你觉得自己被困住了——工作、房贷、日复一日,而股市是你唯一能看到的「出口」。所以你买的不只是一只股票,是一个「翻身」的许诺。这个许诺让你能忍受现在的枯燥,也让你在每次亏损时都能告诉自己「没关系,是为了未来」。问题在于,梦想太远,时间太近:你为了那个不具体的未来,牺牲了太多具体的现在——该止损的时候你留着,该分散的时候你重仓,因为你的决策标准不是「这笔钱现在表现如何」,而是「它符不符合我的剧本」。"},{"title":"关系盲点","content":"你不太跟人聊真实的持仓,因为真实数字会戳破梦想。你更愿意跟人聊「你看好什么赛道」「未来十年什么会涨」——聊这些的时候,你眼里有光,大家也觉得你很有远见。但只有你知道,你的「远见」和你的「账户」之间,隔着一道你不敢跨过去的鸿沟。家人问你赚了多少,你说「还在布局」;朋友问你怎么加仓,你说「长线」——你活成了自己的故事里那个「即将成功的人」,而身边的人慢慢发现,你只是把「成功」无限期推迟了。他们不是不信你的梦想,是开始不信你的执行。"},{"title":"成长处方","content":"把「总有一天」翻译成「具体哪一天」。给你的梦想定三个可验证的节点:比如「两年内账户达到 X,否则重新评估这个剧本」。梦想不一定要放弃,但必须要有计价——给梦想一个价格,你才知道自己每天在为什么付费。同时,把「想象的收益」和「实际的持仓」分开管理:幻想可以继续,但仓位必须服从现实规则——止损、分散、定期复盘,一样都不能少。你要明白:通往理想生活的传送门,从来不是一只股票,是一套你愿意长期执行、并且确实能让你睡着的系统。梦想负责提供方向,系统负责把你送到那里。"}]},"enName":"The Dreamer"},{"code":"FSHP","word":"GHOST","name":"删App侠","tagline":"你的投资策略：跌了删 App，涨了装回来。","traits":["你的手机里，那款炒股 App 的安装次数已破纪录。","你坚信：不打开，就等于没亏。","真相：它每次都在，等你回来。"],"recommendedAsset":"手机流量套餐——你反复下载 App 的最大开支","statBars":[55,70,1,85],"img":"ghost","deepDive":{"preview":"你卸载交易软件的次数,比你清仓的次数还多。每次大跌,你的第一反应不是分析,是「眼不见为净」——注销、卸载、失联,像分手一样决绝。但你也知道,你的持仓还在那里,只是躲进了你的记忆盲区。你表面上是「放下」,实际上是把账户的钥匙藏起来,假装自己从没买过。市场跌的时候你人间蒸发,市场涨的时候你诈尸回来——你的投资生涯,活成了一部恐怖片的开头。","sections":[{"title":"行为根源","content":"你的「卸载大法」,本质是一种情绪管理方式:你处理不了亏损带来的痛感,于是选择处理掉「看到亏损」的渠道。这种行为模式通常来自一次创伤记忆——可能是一次让你刻骨铭心的割肉,让你形成了条件反射:痛=关掉。可问题是,你关掉的不是亏损,是你的知情权。你以为眼不见为净,实际上市场并没有因为你卸载而停止波动,你的焦虑只是被推迟到了下次打开 App 的那一天,而且会加倍返还——每一次「失联」,都在加深你对账户的恐惧,让你下次更不敢打开,形成恶性循环。"},{"title":"关系盲点","content":"你的家人只知道你「在理财」,不知道你到底买了什么、亏了多少——你用一个又一个「还行」「没事」,把关心你的人挡在了账户之外。你不是故意隐瞒,你是怕解释:怕他们追问,怕自己答不上来,怕那句「你到底买了什么」会逼你面对你一直回避的数字。可你知道吗?你的沉默比亏损更让他们担心。真正的风险,从来不是那笔持仓,是你一个人扛着所有情绪、却拒绝任何人的手——你把自己活成了账户的「幽灵」:存在,但不被看见,也不愿意被看见。"},{"title":"成长处方","content":"你需要的不是「重新开始」,是「面对一次」。挑一个周末,打开那个你卸载了三次的软件,把持仓全部列出来,做一个最坏情况的账——算清楚:如果全部归零,你的生活会不会完蛋?大概率不会,而这就是你需要的答案。然后,把「卸载」这个动作从你的工具箱里永久删除:你可以在心里卸,但不能在 App 里卸——因为卸载解决不了问题,只会延迟问题。你还要学会跟至少一个人坦白你的持仓和亏损:说出来之后你会发现,天没塌,而那个愿意听你说的人,会让你从此不再需要「人间蒸发」。"}]},"enName":"The Ghost"},{"code":"FGTP","word":"YOLO","name":"梭哈战神","tagline":"你的仓位管理：全仓。你的风险控制：祈祷。","traits":["你的人生格言：all-in 不一定赢，不 all-in 一定输。","你的账户曲线像心电图，你说是正常的。","说句公道话：你赢的时候，是真的敢。"],"recommendedAsset":"彩票——你与它唯一的区别是它合法（其实都合法）","statBars":[88,3,10,98],"img":"yolo","deepDive":{"preview":"你的座右铭是「人生只有一次」,翻译成投资语言就是「不梭哈等于没参与」。你的账户仓位分布只有两种状态:满仓,和刚卖完准备再满仓。你赚过大钱,也亏过大钱,但你的人生哲学让这两件事看起来一样刺激。朋友劝你「留点现金」,你回一句「现金是给死人的」——然后继续把你的生活费和梦想,一起押进下一个 K 线。你不是不知道风险,你是觉得「不冒险的人生才叫风险」。","sections":[{"title":"行为根源","content":"你的「全押」倾向,心理学上叫「全有或全无」思维——你的人生里没有「部分参与」这个选项。这种思维通常源于一个信念:机会是稀缺的,错过就没了,所以每一次都要全力一击。你享受那种「要么全赢要么全输」的刺激感,因为它让平凡的每一天都变得像决战——但市场不是擂台赛,是马拉松:它不会因为你今天押了全部就给你颁个「勇敢奖」,它只会温柔地把你的「全部」慢慢磨成「一部分」,直到你发现,自己已经用「再赌一把」代替了「好好生活」。你的勇气是真的,可惜市场奖励的不是勇气,是存活率。"},{"title":"关系盲点","content":"你身边的人都佩服你的果断,但没人敢学你。你聚会的时候是最受欢迎的——因为跟着你能听到最刺激的故事,但也是最没人敢深交的——因为你的生活方式暗示着「他的未来不稳定」。你的家人从不反对你投资,因为反对也没用,他们只是默默把你每次「全押」之后的沉默,当作你又一次「在憋大招」。你从来没有真正告诉过他们:你的「人生只有一次」,有一半时候是「人生只剩一次机会」的焦虑。你需要的不是一个观众,是一个能对你说「你慢一点,我在等你」的人——可惜你从不给人开口的机会。"},{"title":"成长处方","content":"「人生只有一次」这句话,也应该包含「慢慢来」这个选项。你的胆量不需要被没收,只需要被分流:把资金切成三份——一份继续满足你的「决战瘾」,一份放在「三个月不能动」的地方,最后一份当成「保命钱」,谁也不能动,包括你。你会发现一个秘密:当你知道自己还有退路的时候,你的决策质量会高得离谱——因为「反正输得起」这句话,才是真正的底气。你缺的从来不是勇气,是「把勇气用在有存活率的地方」的智慧。记住:市场最尊敬的人,不是赢过最大的人,是活到最久的人。"}]},"enName":"The All-In Warlord"},{"code":"FSTP","word":"CHICKEN","name":"恐慌割肉侠","tagline":"你的操作：跌 3% 就割，割完就涨停。","traits":["你是市场公认的「反向指标」——你卖出的股票，次日必涨。","你的止损线比你的底线还低。","建议：下次想卖的时候，先问问自己是不是又慌了。"],"recommendedAsset":"割肉专用小刀（镀金限量版）","statBars":[25,8,60,70],"img":"chicken","deepDive":{"preview":"你的交易生涯可以用一句话总结:买在最高,卖在最低,情绪永远在峰值。你的决策不是靠分析,是靠心跳——涨了怕错过,跌了怕归零,你的每次操作都精准地踩在情绪的刀尖上。你割肉的那天,通常是市场最低点;你追高的那天,通常是阶段顶部。你有个朋友说你「有毒」,但你知道,你不是运气差,你是被自己的恐慌和贪婪,编成了一支双人舞。","sections":[{"title":"行为根源","content":"你的「追涨杀跌」,是教科书级的情绪驱动交易——而教科书通常用它当反面案例。你的问题不在智商,在「反应速度」:市场一涨,你的多巴胺比资金先到位,于是你在最贵的地方买进;市场一跌,你的恐惧比理性先到位,于是你在最便宜的地方卖出。你心里其实清楚「低买高卖」的道理,但你的手指永远比道理快半拍。讽刺的是,你的每一次「终于下定决心」,几乎都发生在情绪的最高点或最低点——你的决心不是来自分析,是来自「我再也忍不住了」。市场最爱的人,就是你这种忍不住的人。"},{"title":"关系盲点","content":"你是个很真的人——你的情绪全写在脸上,赚了请客,亏了消失。朋友都知道你「心大」,但没人敢把重要的事托付给你:因为你的状态太容易被市场牵动,而大家不确定,你扛不扛得住他们的事。你亏钱的时候会自闭,回消息慢,聚餐缺席——你不说,但大家都看得出。你其实很需要有人在那个时候拉你一把,但你从来不说,于是大家只能在你「消失」的日子里,假装什么都没发生。你不是没有朋友,你是没有「允许自己被接住」的习惯。"},{"title":"成长处方","content":"你需要一套「情绪冷却期」的强制流程:任何操作指令,先写下来,等 24 小时,再决定要不要执行。你会发现,90% 的冲动在冷却之后自己就消失了,而剩下那 10% 里,大部分才是真正值得做的。另外,把「看盘」和「操作」彻底分开:你可以看,但每周只允许自己操作一次——像发工资一样固定。你最大的天赋是敏感,这让你能比大多数人更早感知市场情绪——可惜你一直把这份天赋用在了「跟着情绪跑」上,而不是「观察情绪而不动」。从今天开始,试着做那个看戏的人,而不是戏里的人。"}]},"enName":"The Chicken"}],"qr":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAIAAAAP3aGbAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAABcRAAAXEQHKJvM/AAA0xElEQVR42u3de5hd1Xkm+Pf71j6nbroLIQFGho5tbHxBuEExxMGdgCCTHk9MTMediAxJepJMOiTQnZmeyfRYGDDYTicBHPD0pHs6OA1p+0l4IO7Y/ZhbuAQ7BmPAainmYu4SQkLXup+z1/fNH2ufqhKXU4W3Tu3apfeHgKLqnH3WXufUy9prr4u4O4iI6kCrLgAR0VwxsIioNhhYRFQbDCwiqg0GFhHVBgOLiGqDgUVEtcHAIqLaYGARUW0wsIioNhhYRFQbDCwiqg0GFhHVBgOLiGqDgUVEtcHAIqLaYGARUW0wsIioNhhYRFQbDCwiqg8vp+riV19Fd955Z69foteuu+66Xpew18ffvHlzyZeo9oM0D69euSPyWWULi4hqg4FFRLXBwCKi2mBgEVFtMLCIqDYYWERUGwwsIqoNBhYR1QYDi4hqI+vp0devX3/WWWdVfY7dbN++fevWrVWXgqgb/h5N6+mUi0996lNHZDx+71xzzTW9rqItW7aUfIlel7C8Xn8Ob7755pJHaDQa5QvZu3eh+5H5ezSFl4REVBsMLCKqDQYWEdUGA4uIaoOBRUS1wcAiotpgYBFRbTCwiKg2GFhEVBsMLCKqjeoDS3qs6vPDlVdeWXJmxqxPL1kJ119/fckjlDzBWV1yySXdj7958+bu5W+32yUnhcxayGo/iov+9yipPrCIiOaIgUVEtcHAIqLaYGARUW0wsIioNhhYRFQbDCwiqg0GFhHVBgOLiGqjt7vmHA2ee+65733ve90f88lPfrLLT++4444YY08Ledttt3 var LANG_LINKS = {"zh":"index.html","hk":"index-hk.html","en":"index-en.html"};
var COPY = {"title":"NeuralFin 16 人格深度解读","eyebrow":"NEURALFIN 深度解读","h1":"16 种投资人格，深度解读","sub":"每种投资人格背后，都有一套完整的行为密码。点击任意人格，查看 TA 的完整深度解读——看看你是不是也在里面。","deepDiveTitle":"深度解读","footer":"© NeuralFin · 深度解读","version":"深度解读","statLabels":["信念值","止损纪律","复盘频率","嘴硬指数"],"statTitle":"四维画像","_lang":"zh"};
var LANG = 'zh';
var lastPersonaCode = null;

/* 轻量埋点:本地收集 + console(与 NBTI track() 同接口;接入后端时替换上报实现即可) */
window.__events = window.__events || [];
function track(name, payload) {
  var p = payload || {};
  var ev = { name: name, payload: p, ts: Date.now() };
  window.__events.push(ev);
  if (window.console && window.console.log) window.console.log('[track]', name, JSON.stringify(p));
}

/* ---- 四维条渲染(处理 MAX/MIN/∞ 特殊值) ---- */
function statVal(v) {
  if (typeof v === 'string') {
    if (v === 'MAX' || v === '∞') return { w: 100, label: v };
    if (v === 'MIN') return { w: 4, label: v };
    return { w: Math.min(100, parseFloat(v) || 0), label: v };
  }
  return { w: Math.max(0, Math.min(100, v)), label: String(v) };
}
function statBarsHtml(bars) {
  if (!bars || !bars.length) return '';
  return '<div class="card"><h3>' + COPY.statTitle + '</h3>' + bars.map(function(v, i) {
    var s = statVal(v);
    return '<div class="stat-row"><span class="stat-label">' + COPY.statLabels[i] + '</span>' +
      '<span class="stat-track"><span class="stat-fill" style="width:' + s.w + '%"></span></span>' +
      '<span class="stat-val">' + s.label + '</span></div>';
  }).join('') + '</div>';
}

/* ---- 深度解读(App 内:preview + 全部 sections 直接展示,无锁定) ---- */
function deepDiveHtml(persona) {
  var dd = persona.deepDive;
  if (!dd) return '';
  var sections = dd.sections.map(function(sec) {
    return '<div class="dd-section"><h4>' + sec.title + '</h4><p>' + sec.content + '</p></div>';
  }).join('');
  return '<div class="card deepdive"><h3>' + COPY.deepDiveTitle + '</h3>' +
    '<div class="dd-preview">' + dd.preview + '</div>' + sections + '</div>';
}

/* ---- 弹层 ---- */
var modal = document.getElementById('persona-modal');
var modalContent = document.getElementById('modal-content');
function openPersona(word) {
  var p = DATA.personas.filter(function(x) { return x.word === word; })[0];
  if (!p) return;
  lastPersonaCode = p.code;
  modalContent.innerHTML =
    '<div class="modal-head">' +
      '<img src="' + p.img + '.webp" alt="' + p.name + '" loading="lazy">' +
      '<div class="type-badge">' + p.code + '</div>' +
      '<div class="persona">' + p.name + '</div>' +
      (LANG === 'en' ? '' : '<div class="p-en-lg">' + (p.enName || '') + '</div>') +
      '<p class="tagline">' + p.tagline + '</p>' +
    '</div>' +
    '<div class="modal-body">' +
      statBarsHtml(p.statBars) +
      deepDiveHtml(p) +
    '</div>';
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  track('deep_dive_persona_open', { personaCode: p.code });
}
function closeModal() {
  modal.hidden = true;
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

/* ---- 渲染网格 ---- */
(function render() {
  var grid = document.getElementById('persona-grid');
  grid.innerHTML = DATA.personas.map(function(p) {
    var codeHtml = '<span class="p-code">' + p.code + '</span>';
    var nameBlock = LANG === 'en'
      ? '<div class="p-name">' + p.name + codeHtml + '</div>'
      : '<div class="p-name">' + p.name + codeHtml + '</div>' +
        '<div class="p-en">' + (p.enName || '') + '</div>';
    return '<div class="p-card" role="button" tabindex="0" data-word="' + p.word + '" onclick="openPersona(this.dataset.word)">' +
      '<img src="' + p.img + '.webp" alt="' + p.name + '" loading="lazy">' +
      nameBlock + '</div>';
  }).join('');
  track('deep_dive_page_view', { lang: COPY._lang || '' });
})();

</script>
