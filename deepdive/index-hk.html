<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuralFin 16 人格深度解讀</title>
<style>
  :root {
    --bg-primary: #0A0A0A;
    --bg-card: #1C1C1E;
    --bg-card-alt: #222224;
    --accent-primary: #00D9A0;
    --accent-dim: rgba(0,217,160,0.15);
    --text-primary: #FFFFFF;
    --text-secondary: #9B9B9F;
    --text-disabled: #8A8A8F;
    --border-subtle: #2C2C2E;
    --accent-deep: #00B88A;
    --accent-bright: #4DFFC4;
    --accent-08: rgba(0,217,160,.08);
    --accent-25: rgba(0,217,160,.25);
    --accent-35: rgba(0,217,160,.35);
    --accent-40: rgba(0,217,160,.40);
    --accent-50: rgba(0,217,160,.50);
    --bg-primary-0: rgba(10,10,10,0);
    --bg-primary-92: rgba(10,10,10,.92);
    --bg-primary-94: rgba(10,10,10,.94);
    --brand-gold: #D9B54F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background:
      radial-gradient(circle at 18% 16%, rgba(0,230,138,.08), transparent 30%),
      radial-gradient(circle at 82% 10%, rgba(145,201,255,.06), transparent 30%),
      radial-gradient(circle at 88% 78%, rgba(215,183,104,.05), transparent 30%),
      var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }

  /* ---- header(与 NBTI 一致) ---- */
  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  .brand img { height: 28px; width: auto; display: block; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .version { font-size: 12px; color: var(--text-secondary); }
  .lang-switcher { font-size: 13px; }
  .lang-option { color: var(--text-disabled); text-decoration: none; padding: 4px 6px; border-radius: 6px; }
  .lang-option:hover { color: var(--accent-primary); }
  .lang-option[aria-current="page"] { background: var(--accent-primary); color: var(--bg-primary); font-weight: 800; border-radius: 999px; }
  .lang-divider { color: var(--border-subtle); }

  /* ---- hero ---- */
  .hero { text-align: center; padding: 44px 0 36px; }
  .eyebrow { display: inline-block; border: 1px solid var(--accent-25); border-radius: 999px; padding: 8px 14px; background: var(--accent-dim); color: var(--accent-primary); font-size: 12px; letter-spacing: 1px; font-weight: 700; margin-bottom: 20px; }
  .hero h1 { font-size: 34px; font-weight: 800; line-height: 1.25; letter-spacing: 0.01em; margin-bottom: 14px; }
  .hero-sub { color: var(--text-secondary); font-size: 15px; line-height: 1.8; max-width: 560px; margin: 0 auto; }

  /* ---- 人格网格 ---- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; } }
  .p-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; overflow: hidden; cursor: pointer; padding: 0; text-align: center; transition: transform .15s, border-color .15s; }
  .p-card:hover { border-color: var(--accent-40); transform: translateY(-2px); }
  .p-card:active { transform: scale(.97); }
  .p-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .p-name { font-size: 15px; font-weight: 700; padding: 10px 8px 2px; letter-spacing: 0.02em; }
  .p-code { display: inline-block; font-size: 11px; color: var(--accent-primary); border: 1px solid var(--accent-25); background: var(--accent-dim); border-radius: 999px; padding: 2px 8px; margin-left: 6px; letter-spacing: 1px; vertical-align: 2px; }
  .p-en { font-size: 11px; color: var(--text-secondary); padding: 2px 8px 12px; }

  /* ---- 弹层 ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal-overlay[hidden] { display: none; }
  .modal-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 88dvh; overflow-y: auto; position: relative; padding: 22px 20px calc(26px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .modal-card { border-radius: 18px; max-height: 85vh; } }
  .modal-close { position: absolute; top: 12px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-subtle); background: var(--bg-card-alt); color: var(--text-secondary); font-size: 16px; cursor: pointer; z-index: 2; }
  .modal-close:active { transform: scale(.92); }
  .modal-head { text-align: center; padding: 8px 32px 0; }
  .modal-head img { width: 110px; height: 110px; border-radius: 14px; object-fit: cover; display: block; margin: 0 auto 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .modal-head .type-badge { display: inline-block; font-size: 11px; color: var(--accent-primary); border: 1px solid var(--accent-25); background: var(--accent-dim); border-radius: 999px; padding: 5px 12px; letter-spacing: 1px; margin-bottom: 8px; }
  .modal-head .persona { font-size: 30px; font-weight: 800; letter-spacing: 0.02em; }
  .modal-head .p-en-lg { font-size: 13px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 0.05em; }
  .modal-head .tagline { font-size: 14px; line-height: 1.8; color: var(--text-secondary); margin-top: 10px; }
  .modal-body { margin-top: 18px; }
  .card { background: var(--bg-card-alt); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h3 { font-size: 14px; color: var(--accent-primary); letter-spacing: 1px; margin-bottom: 12px; font-weight: 700; }
  .card p { font-size: 15px; line-height: 1.8; color: var(--text-primary); word-break: break-word; overflow-wrap: break-word; }

  /* ---- 四维条 ---- */
  .stat-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .stat-label { width: 72px; flex: none; font-size: 12px; color: var(--text-secondary); }
  .stat-track { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-deep), var(--accent-bright)); min-width: 2px; }
  .stat-val { width: 34px; flex: none; text-align: right; font-size: 12px; color: var(--accent-primary); font-weight: 700; }

  /* ---- 深度解读(App 内全量展示) ---- */
  .dd-preview { font-size: 15px; line-height: 1.9; color: var(--text-primary); margin-bottom: 6px; word-break: break-word; overflow-wrap: break-word; }
  .dd-section h4 { color: var(--accent-primary); font-size: 14px; margin: 14px 0 6px; letter-spacing: .5px; }
  .dd-section p { font-size: 15px; line-height: 1.9; color: var(--text-primary); margin: 0; word-break: break-word; overflow-wrap: break-word; }

  footer { text-align: center; color: var(--text-disabled); font-size: 12px; padding: 40px 0 8px; }
</style>
</head>

var COPY = {"title":"NeuralFin 16 人格深度解讀","eyebrow":"NEURALFIN 深度解讀","h1":"16 種投資人格，深度解讀","sub":"每種投資人格背後，都有一套完整嘅行為密碼。㩒任意人格，睇吓佢嘅完整深度解讀——睇下你係咪都喺入面。","deepDiveTitle":"深度解讀","footer":"© NeuralFin · 深度解讀","version":"深度解讀","statLabels":["信念值","止蝕紀律","翻睇頻率","死撐指數"],"statTitle":"四維畫像","_lang":"hk"};
var LANG = 'hk';
var lastPersonaCode = null;

/* 轻量埋点:本地收集 + console(与 NBTI track() 同接口;接入后端时替换上报实现即可) */
window.__events = window.__events || [];
function track(name, payload) {
  var p = payload || {};
  var ev = { name: name, payload: p, ts: Date.now() };
  window.__events.push(ev);
  if (window.console && window.console.log) window.console.log('[track]', name, JSON.stringify(p));
}

/* ---- 四维条渲染(处理 MAX/MIN/∞ 特殊值) ---- */
function statVal(v) {
  if (typeof v === 'string') {
    if (v === 'MAX' || v === '∞') return { w: 100, label: v };
    if (v === 'MIN') return { w: 4, label: v };
    return { w: Math.min(100, parseFloat(v) || 0), label: v };
  }
  return { w: Math.max(0, Math.min(100, v)), label: String(v) };
}
function statBarsHtml(bars) {
  if (!bars || !bars.length) return '';
  return '<div class="card"><h3>' + COPY.statTitle + '</h3>' + bars.map(function(v, i) {
    var s = statVal(v);
    return '<div class="stat-row"><span class="stat-label">' + COPY.statLabels[i] + '</span>' +
      '<span class="stat-track"><span class="stat-fill" style="width:' + s.w + '%"></span></span>' +
      '<span class="stat-val">' + s.label + '</span></div>';
  }).join('') + '</div>';
}

/* ---- 深度解读(App 内:preview + 全部 sections 直接展示,无锁定) ---- */
function deepDiveHtml(persona) {
  var dd = persona.deepDive;
  if (!dd) return '';
  var sections = dd.sections.map(function(sec) {
    return '<div class="dd-section"><h4>' + sec.title + '</h4><p>' + sec.content + '</p></div>';
  }).join('');
  return '<div class="card deepdive"><h3>' + COPY.deepDiveTitle + '</h3>' +
    '<div class="dd-preview">' + dd.preview + '</div>' + sections + '</div>';
}

/* ---- 弹层 ---- */
var modal = document.getElementById('persona-modal');
var modalContent = document.getElementById('modal-content');
function openPersona(word) {
  var p = DATA.personas.filter(function(x) { return x.word === word; })[0];
  if (!p) return;
  lastPersonaCode = p.code;
  modalContent.innerHTML =
    '<div class="modal-head">' +
      '<img src="' + p.img + '.webp" alt="' + p.name + '" loading="lazy">' +
      '<div class="type-badge">' + p.code + '</div>' +
      '<div class="persona">' + p.name + '</div>' +
      (LANG === 'en' ? '' : '<div class="p-en-lg">' + (p.enName || '') + '</div>') +
      '<p class="tagline">' + p.tagline + '</p>' +
    '</div>' +
    '<div class="modal-body">' +
      statBarsHtml(p.statBars) +
      deepDiveHtml(p) +
    '</div>';
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  track('deep_dive_persona_open', { personaCode: p.code });
}
function closeModal() {
  modal.hidden = true;
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

/* ---- 渲染网格 ---- */
(function render() {
  var grid = document.getElementById('persona-grid');
  grid.innerHTML = DATA.personas.map(function(p) {
    var codeHtml = '<span class="p-code">' + p.code + '</span>';
    var nameBlock = LANG === 'en'
      ? '<div class="p-name">' + p.name + codeHtml + '</div>'
      : '<div class="p-name">' + p.name + codeHtml + '</div>' +
        '<div class="p-en">' + (p.enName || '') + '</div>';
    return '<div class="p-card" role="button" tabindex="0" data-word="' + p.word + '" onclick="openPersona(this.dataset.word)">' +
      '<img src="' + p.img + '.webp" alt="' + p.name + '" loading="lazy">' +
      nameBlock + '</div>';
  }).join('');
  track('deep_dive_page_view', { lang: COPY._lang || '' });
})();

</script>
